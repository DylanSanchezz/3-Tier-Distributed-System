global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 30s

# Real-time Database & Redis HA Dashboard (http://localhost:8404/stats)
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 3s
    stats show-legends
    stats show-node

# ToDo 3.1, 3.2 & 3.3: Galera Write Endpoint (Single-Writer Primary + Automatic Failover)
# Routes DDL/DML writes to a single active Galera node to prevent WSREP certification deadlocks,
# automatically failing over to galera2 -> galera3 if galera1 goes down.
listen galera_write
    bind *:3306
    mode tcp
    option tcp-check
    server galera1 galera1:3306 check inter 2s fall 2 rise 2 maxconn 90
    server galera2 galera2:3306 check inter 2s fall 2 rise 2 maxconn 90 backup
    server galera3 galera3:3306 check inter 2s fall 2 rise 2 maxconn 90 backup

# ToDo 3.1, 3.2 & 3.3: Galera Read Endpoint (Multi-Node Round-Robin Read Scaling)
# Distributes SELECT read queries across all healthy synced Galera nodes.
listen galera_read
    bind *:3307
    mode tcp
    balance roundrobin
    option tcp-check
    server galera1 galera1:3306 check inter 2s fall 2 rise 2 maxconn 90
    server galera2 galera2:3306 check inter 2s fall 2 rise 2 maxconn 90
    server galera3 galera3:3306 check inter 2s fall 2 rise 2 maxconn 90

# ToDo 2.2: Redis High-Availability Endpoint (Master-Replica Failover with Layer-7 PING/PONG)
listen redis_ha
    bind *:6379
    mode tcp
    option tcp-check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server redis-master redis-master:6379 check inter 2s fall 2 rise 2
    server redis-replica redis-replica:6379 check inter 2s fall 2 rise 2 backup
