global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option http-server-close
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend presentation
    bind *:80
    http-request set-header X-Presentation-LB presentation-lb-master
    http-response set-header Cache-Control "no-store, no-cache, must-revalidate, max-age=0"

    acl is_nagios hdr_sub(User-Agent) -i check_http
    acl is_api_products path_beg /api/products/cheapest
    acl is_api_reviews path_sub /reviews
    acl is_api_other path_beg /api/
    acl is_root path / /index.html

    use_backend websites_static if is_nagios
    use_backend websites_products if is_api_products
    use_backend websites_reviews if is_api_reviews
    use_backend websites_api_other if is_api_other
    use_backend websites_page if is_root
    default_backend websites_static

backend websites_page
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check inter 2s fall 2 rise 2
    server web2 web2:80 check inter 2s fall 2 rise 2
    server web3 web3:80 check inter 2s fall 2 rise 2

backend websites_products
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check inter 2s fall 2 rise 2
    server web2 web2:80 check inter 2s fall 2 rise 2
    server web3 web3:80 check inter 2s fall 2 rise 2

backend websites_reviews
    balance roundrobin
    option httpchk GET /
    server web2 web2:80 check inter 2s fall 2 rise 2
    server web3 web3:80 check inter 2s fall 2 rise 2
    server web1 web1:80 check inter 2s fall 2 rise 2

backend websites_api_other
    balance roundrobin
    option httpchk GET /
    server web3 web3:80 check inter 2s fall 2 rise 2
    server web1 web1:80 check inter 2s fall 2 rise 2
    server web2 web2:80 check inter 2s fall 2 rise 2

backend websites_static
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check inter 2s fall 2 rise 2
    server web2 web2:80 check inter 2s fall 2 rise 2
    server web3 web3:80 check inter 2s fall 2 rise 2
