define command {
    command_name check_tcp_port
    command_line $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}

define command {
    command_name check_http_port
    command_line $USER1$/negate -u CRITICAL $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u /
}

define host {
    use                     generic-host
    check_interval          1
    retry_interval          1
    max_check_attempts      1
    host_name               presentation-lb-master
    alias                   Presentation HAProxy master
    address                 presentation-lb-master
    check_command           check_tcp_port!80
}

