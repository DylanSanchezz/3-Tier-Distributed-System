global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option http-server-close
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend application
    bind *:8080
    http-request set-header X-Application-LB application-lb-master
    http-response set-header Cache-Control "no-store, no-cache, must-revalidate, max-age=0"

    acl is_nagios hdr_sub(User-Agent) -i check_http
    acl is_products path_beg /products/cheapest
    acl is_reviews path_sub /reviews

    use_backend application_health if is_nagios
    use_backend application_products if is_products
    use_backend application_reviews if is_reviews
    default_backend application_other

backend application_products
    balance roundrobin
    option httpchk GET /health
    server app1 app1:8080 check inter 2s fall 2 rise 2
    server app2 app2:8080 check inter 2s fall 2 rise 2
    server app3 app3:8080 check inter 2s fall 2 rise 2

backend application_reviews
    balance roundrobin
    option httpchk GET /health
    server app2 app2:8080 check inter 2s fall 2 rise 2
    server app3 app3:8080 check inter 2s fall 2 rise 2
    server app1 app1:8080 check inter 2s fall 2 rise 2

backend application_other
    balance roundrobin
    option httpchk GET /health
    server app3 app3:8080 check inter 2s fall 2 rise 2
    server app1 app1:8080 check inter 2s fall 2 rise 2
    server app2 app2:8080 check inter 2s fall 2 rise 2

backend application_health
    balance roundrobin
    option httpchk GET /health
    server app1 app1:8080 check inter 2s fall 2 rise 2
    server app2 app2:8080 check inter 2s fall 2 rise 2
    server app3 app3:8080 check inter 2s fall 2 rise 2
